version: 1
settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/seals.json
  sealsPath: .attest-it/seals.json
team:
  mike-north:
    name: Mike North
    publicKey: 5L1qHe86pTHIEscURLVL7pUdK+Px74tDF11gBHPDOAE=
    publicKeyAlgorithm: ed25519
    email: michael.l.north@gmail.com
    github: mike-north
gates:
  1password-integration:
    name: 1Password Integration Tests
    description: Manual verification that 1Password key provider works with real vaults
    authorizedSigners:
      - mike-north
    fingerprint:
      paths:
        - packages/cli/test/manual/scripts/1password-integration.ts
        - packages/core/src/key-provider/discovery.ts
        - packages/core/src/key-provider/vault-key-provider.ts
        - packages/core/src/key-provider/registry.ts
        - packages/core/src/key-provider/store.ts
        - packages/core/src/seal/**/*.ts
        - packages/core/src/crypto.ts
    maxAge: 90d
  keychain-integration:
    name: macOS Keychain Integration Tests
    description: Manual verification that macOS Keychain key provider works with
      real Keychain
    authorizedSigners:
      - mike-north
    fingerprint:
      paths:
        - packages/cli/test/manual/scripts/keychain-integration.ts
        - packages/core/src/key-provider/discovery.ts
        - packages/core/src/key-provider/vault-key-provider.ts
        - packages/core/src/key-provider/registry.ts
        - packages/core/src/key-provider/store.ts
        - packages/core/src/seal/**/*.ts
        - packages/core/src/crypto.ts
    maxAge: 90d
  yubikey-integration:
    name: YubiKey Integration Tests
    description: Manual verification that YubiKey key provider works with real hardware
    authorizedSigners:
      - mike-north
    fingerprint:
      paths:
        - packages/cli/test/manual/scripts/yubikey-integration.ts
        - packages/core/src/key-provider/discovery.ts
        - packages/core/src/key-provider/vault-key-provider.ts
        - packages/core/src/key-provider/registry.ts
        - packages/core/src/key-provider/store.ts
        - packages/core/src/seal/**/*.ts
        - packages/core/src/crypto.ts
    maxAge: 90d
  cli-interactive:
    name: CLI Interactive Tests
    description: Manual verification of interactive CLI experiences and visual rendering
    authorizedSigners:
      - mike-north
    fingerprint:
      paths:
        - packages/cli/test/manual/scripts/visual-verification.ts
        - packages/cli/src/commands/*-interactive.tsx
        - packages/cli/src/components/**/*.tsx
    maxAge: 90d
