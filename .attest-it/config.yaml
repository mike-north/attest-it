# attest-it configuration
# See https://github.com/attest-it/attest-it for documentation

version: 1

settings:
  # How long attestations remain valid (in days)
  maxAgeDays: 90
  # Path to the attestations file
  attestationsPath: .attest-it/attestations.json
  # Signing algorithm
  algorithm: ed25519

# Team members authorized to sign attestations
team:
  mike-north:
    name: Mike North
    publicKey: Fzpq2YHEvpA2BwjGnW5ZcZF+WyUbsiyTFFMjPEK3SfA=

# Gates define what code changes require re-attestation
gates:
  cli-interactive:
    name: CLI Interactive Tests
    description: Manual verification of interactive CLI experiences
    authorizedSigners:
      - mike-north
    fingerprint:
      paths:
        - packages/cli/src/commands/keygen-interactive.tsx
        - packages/cli/src/components
    maxAge: 90d

# Test suites that require manual verification
suites:
  keygen-interactive:
    description: Verify interactive keygen wizard displays correct options and completes successfully
    gate: cli-interactive
    command: |
      echo "=== Manual Test: keygen-interactive ==="
      echo ""
      echo "Steps:"
      echo "1. Run: pnpm --filter @attest-it/cli exec attest-it keygen"
      echo "2. Verify provider options appear (Filesystem, Keychain if on macOS, 1Password if op installed)"
      echo "3. Select 'Local Filesystem' provider"
      echo "4. Verify keypair is generated and success message shows paths"
      echo ""
      echo "Expected: Keypair generated successfully with correct path display"
      echo ""
      read -p "Did the test pass? (y/n): " result
      [ "$result" = "y" ] || [ "$result" = "Y" ]

  keygen-escape-cancel:
    description: Verify pressing Escape cancels the keygen flow gracefully
    gate: cli-interactive
    command: |
      echo "=== Manual Test: keygen-escape-cancel ==="
      echo ""
      echo "Steps:"
      echo "1. Run: pnpm --filter @attest-it/cli exec attest-it keygen"
      echo "2. When provider selection appears, press Escape"
      echo "3. Verify the flow is cancelled without error or crash"
      echo ""
      echo "Expected: Clean exit with no stack trace or error message"
      echo ""
      read -p "Did the test pass? (y/n): " result
      [ "$result" = "y" ] || [ "$result" = "Y" ]
