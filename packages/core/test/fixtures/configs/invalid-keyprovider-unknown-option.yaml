version: 1

settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/attestations.json
  keyProvider:
    type: filesystem
    options:
      privateKeyPath: /custom/path/private.pem
      unknownOption: invalid

suites:
  unit:
    packages:
      - '@attest-it/core'
