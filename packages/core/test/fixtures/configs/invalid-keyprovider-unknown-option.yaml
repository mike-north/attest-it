version: 1

settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/attestations.json
  keyProvider:
    type: filesystem
    options:
      privateKeyPath: /custom/path/private.pem
      unknownOption: invalid

team:
  test-user:
    name: Test User
    publicKey: Fzpq2YHEvpA2BwjGnW5ZcZF+WyUbsiyTFFMjPEK3SfA=

gates:
  unit-gate:
    name: Unit Gate
    description: Unit test gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - '@attest-it/core'
    maxAge: 30d

suites:
  unit:
    gate: unit-gate
