version: 1
settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/attestations.json
  defaultCommand: pnpm test

suites:
  visual-effects:
    description: Flash animations
    command: pnpm test:visual
    packages:
      - packages/visual

  custom-colors:
    description: Custom color tests
    command: pnpm test:colors
    packages:
      - packages/colors

  focus-detection:
    description: Focus detection tests
    command: pnpm test:focus
    packages:
      - packages/focus

  full-acceptance:
    description: Complete test suite
    command: pnpm test:all
    packages:
      - packages/*
    depends_on:
      - visual-effects
      - focus-detection

groups:
  ui-tests:
    - visual-effects
    - custom-colors
  behavior-tests:
    - focus-detection
