version: 1
settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/attestations.json
  defaultCommand: pnpm test

team:
  test-user:
    name: Test User
    publicKey: Fzpq2YHEvpA2BwjGnW5ZcZF+WyUbsiyTFFMjPEK3SfA=

gates:
  visual-gate:
    name: Visual Gate
    description: Visual test gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/visual
    maxAge: 30d
  colors-gate:
    name: Colors Gate
    description: Color test gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/colors
    maxAge: 30d
  focus-gate:
    name: Focus Gate
    description: Focus detection gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/focus
    maxAge: 30d
  sessions-gate:
    name: Sessions Gate
    description: Multi-session test gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/sessions
    maxAge: 30d

suites:
  visual-effects:
    gate: visual-gate
    description: Flash animations
    command: pnpm test:visual

  custom-colors:
    gate: colors-gate
    description: Custom color tests
    command: pnpm test:colors

  focus-detection:
    gate: focus-gate
    description: Focus detection tests
    command: pnpm test:focus

  multi-session:
    gate: sessions-gate
    description: Multi-session tests
    command: pnpm test:sessions

groups:
  ui-tests:
    - visual-effects
    - custom-colors
  behavior-tests:
    - focus-detection
    - multi-session
