version: 1

settings:
  defaultCommand: echo "tests passed"
  # Optional: Configure key storage provider
  # keyProvider:
  #   type: filesystem
  #   options:
  #     privateKeyPath: .attest-it/private.pem
  # Or use 1Password:
  # keyProvider:
  #   type: 1password
  #   options:
  #     account: user@example.com
  #     vault: Development
  #     itemName: attest-it-private-key

# Suites for CLI run command (reference gates defined in policy.yaml)
suites:
  example:
    description: Example test suite
    gate: example-gate
    command: echo "example tests passed"

  failing:
    description: Suite with failing tests
    gate: failing-gate
    command: exit 1
