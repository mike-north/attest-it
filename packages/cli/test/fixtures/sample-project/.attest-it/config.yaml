version: 1

settings:
  maxAgeDays: 30
  publicKeyPath: .attest-it/pubkey.pem
  attestationsPath: .attest-it/attestations.json
  defaultCommand: echo "tests passed"
  # Optional: Configure key storage provider
  # keyProvider:
  #   type: filesystem
  #   options:
  #     privateKeyPath: .attest-it/private.pem
  # Or use 1Password:
  # keyProvider:
  #   type: 1password
  #   options:
  #     account: user@example.com
  #     vault: Development
  #     itemName: attest-it-private-key

# Team members who can create seals
team:
  test-user:
    name: Test User
    publicKey: placeholder-will-be-set-by-keygen

# Gates for seal-based verification
gates:
  example-gate:
    name: Example Gate
    description: Example test gate
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/example
    maxAge: 30d

  failing-gate:
    name: Failing Gate
    description: Gate with failing tests
    authorizedSigners:
      - test-user
    fingerprint:
      paths:
        - packages/example
    maxAge: 30d

# Suites for CLI run command (extends gates with commands)
suites:
  example:
    description: Example test suite
    gate: example-gate
    command: echo "example tests passed"

  failing:
    description: Suite with failing tests
    gate: failing-gate
    command: exit 1
