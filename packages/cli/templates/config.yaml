# yaml-language-server: $schema=https://raw.githubusercontent.com/mike-north/attest-it/main/schemas/v1/config.schema.json
# attest-it operational configuration
#
# This file defines HOW suites run. It may be loaded from a pull request branch,
# so it must never contain trust data (team, gates) — those live in policy.yaml.
# Every suite references a gate defined in policy.yaml.
#
# See https://github.com/mike-north/attest-it for documentation.

version: 1

settings: {}

# Suites bind a runnable command to a gate. Each suite must reference a gate
# from policy.yaml, which supplies the fingerprint configuration and the set of
# authorized signers.
#
# Example:
#
# suites:
#   visual-tests:
#     description: Visual regression tests requiring human review
#     gate: cli-interactive
#     command: pnpm vitest packages/ui

suites: {}
