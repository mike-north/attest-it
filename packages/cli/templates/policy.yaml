# yaml-language-server: $schema=https://raw.githubusercontent.com/mike-north/attest-it/main/schemas/v1/policy.schema.json
# attest-it policy configuration (trust-critical)
#
# This file defines WHO may sign and WHAT is protected. It is loaded from the
# repository's default branch so that pull requests cannot tamper with trust
# data. Keep it under review-gated change control.
#
# See https://github.com/mike-north/attest-it for documentation.

version: 1

settings:
  # How long a seal remains valid (in days)
  maxAgeDays: 30

# Team members who can sign seals.
# Add members with: attest-it team join (for yourself) or team add (for others)
#
# team:
#   mike-north:
#     name: Mike North
#     email: mike@example.com
#     github: mike-north
#     publicKey: Fzpq2YHEvpA2BwjGnW5ZcZF+WyUbsiyTFFMjPEK3SfA=
#     publicKeyAlgorithm: ed25519

team: {}

# Gates define what code areas require a seal and who can sign.
#
# Example:
#
# gates:
#   cli-interactive:
#     name: CLI Interactive Tests
#     description: Manual verification of interactive CLI experiences
#     authorizedSigners:
#       - mike-north
#     fingerprint:
#       paths:
#         - packages/cli/src/commands
#       exclude:
#         - '**/*.spec.ts'
#     maxAge: 90d

gates: {}
