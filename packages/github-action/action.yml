name: 'attest-it verify'
description: 'Verify human-gated test attestations'
author: 'attest-it'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  working-directory:
    description: 'Directory to run attest-it from (defaults to repository root)'
    required: false
    default: '.'

  config-path:
    description: 'Path to attest-it config file (relative to working-directory)'
    required: false

  github-token:
    description: 'GitHub token for fetching policy from base branch (required for PRs)'
    required: false
    default: ${{ github.token }}

  policy-path:
    description: 'Path to policy file (relative to repo root)'
    required: false
    default: '.attest-it/policy.yaml'

  policy-ref:
    description: |
      Git ref (branch/tag) to fetch policy from. Defaults to base branch for PRs,
      or reads from filesystem for pushes. Use this to enforce policy from a
      specific branch like 'production' regardless of PR target.
    required: false

  suite:
    description: 'Verify specific suite only'
    required: false

  fail-on-missing:
    description: 'Fail if any suite lacks attestation'
    required: false
    default: 'true'

  strict:
    description: 'Fail on warnings (approaching expiry)'
    required: false
    default: 'false'

outputs:
  valid:
    description: 'Whether all attestations are valid (true/false)'

  suites:
    description: 'JSON object with per-suite status'

runs:
  using: 'node20'
  main: 'dist/index.cjs'
