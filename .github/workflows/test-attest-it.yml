name: Test attest-it Action

on:
  pull_request:
    branches: [main]

jobs:
  # Test 1: Valid attestation should pass (split config model)
  test-valid-attestation:
    name: Valid attestation passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify valid attestation
        uses: ./packages/github-action
        with:
          working-directory: packages/github-action/test/fixtures/valid-attestation
          policy-path: .attest-it/policy.yaml
          config-path: .attest-it/config.yaml
          # Use PR branch for policy since test fixtures only exist in PR
          policy-ref: ${{ github.head_ref }}
          fail-on-missing: 'true'

      - name: Confirm success
        run: echo "Valid attestation test passed"

  # Test 2: Missing attestation should fail when fail-on-missing is true
  test-missing-attestation:
    name: Missing attestation fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify missing attestation fails
        id: verify
        uses: ./packages/github-action
        continue-on-error: true
        with:
          working-directory: packages/github-action/test/fixtures/missing-attestation
          policy-path: .attest-it/policy.yaml
          config-path: .attest-it/config.yaml
          # Use PR branch for policy since test fixtures only exist in PR
          policy-ref: ${{ github.head_ref }}
          fail-on-missing: 'true'

      - name: Check that action failed as expected
        run: |
          if [ "${{ steps.verify.outcome }}" != "failure" ]; then
            echo "Expected action to fail but it succeeded"
            exit 1
          fi
          echo "Missing attestation correctly caused failure"
