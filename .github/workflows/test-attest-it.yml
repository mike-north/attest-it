name: Test attest-it Action

on:
  pull_request:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test action with fixture (working-directory)
        uses: ./packages/github-action
        with:
          working-directory: packages/github-action/test/fixtures/sample-project
          fail-on-missing: 'false'

      - name: Verify action outputs
        run: |
          echo "Action completed successfully"
          echo "This validates the action can load config and run verification"
