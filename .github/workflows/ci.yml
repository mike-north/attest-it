name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/check-major-bump-guard.mjs shells out to
          # `changeset status`, which needs to resolve the merge-base against
          # `main` — a shallow (default depth-1) checkout has no local `main`
          # ref/history for that, and the changeset CLI throws.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report OpenSSL version
        run: openssl version

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Check policy-ref guard self-test
        run: node scripts/check-policy-ref-guard.mjs --self-test

      - name: Check no unsafe policy-ref overrides in workflows
        run: node scripts/check-policy-ref-guard.mjs

      - name: Check major-bump guard self-test
        run: node scripts/check-major-bump-guard.mjs --self-test

      - name: Check no major/1.0 version bumps in changeset release plan
        run: node scripts/check-major-bump-guard.mjs

  # Test the GitHub Action using act (runs action in simulated GitHub environment)
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install act
        run: |
          curl -s https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash
          # The install script puts act in ./bin/act, move it to /usr/local/bin
          sudo mv ./bin/act /usr/local/bin/act

      - name: Run action tests with act
        run: |
          act -W packages/github-action/test/act-workflows push \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            --container-architecture linux/amd64

  # Test CLI in Docker containers
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Docker tests
        run: pnpm --filter @attest-it/cli test:docker
