name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report OpenSSL version
        run: openssl version

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Check policy-ref guard self-test
        run: node scripts/check-policy-ref-guard.mjs --self-test

      - name: Check no unsafe policy-ref overrides in workflows
        run: node scripts/check-policy-ref-guard.mjs

      - name: Check major-bump guard self-test
        run: node scripts/check-major-bump-guard.mjs --self-test

      - name: Check no major/1.0 version bumps in changeset release plan
        run: node scripts/check-major-bump-guard.mjs

  # Test the GitHub Action using act (runs action in simulated GitHub environment)
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install act
        run: |
          curl -s https://raw.githubusercontent.com/nektos/act/v0.2.89/install.sh | sudo bash -s v0.2.89
          # The install script puts act in ./bin/act, move it to /usr/local/bin
          sudo mv ./bin/act /usr/local/bin/act

      - name: Run action tests with act
        run: |
          # act runs every job in the workflow file concurrently by default. All three
          # jobs here need actions/setup-node@v4 and pnpm/action-setup@v4, which act
          # clones on first use into the shared ~/.cache/act directory. Running them
          # concurrently races: one job can `docker cp` that cache into its container
          # while another job is still cloning it, producing spurious
          # "lstat ...: no such file or directory" failures. --concurrent-jobs 1
          # serializes job execution so the cache is always fully populated before
          # it's read.
          act -W packages/github-action/test/act-workflows push \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            --container-architecture linux/amd64 \
            --concurrent-jobs 1

  # Test CLI in Docker containers
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Docker tests
        run: pnpm --filter @attest-it/cli test:docker
