name: Verify Manual Test Attestations

# This workflow verifies that manual test attestations exist and are valid.
#
# Security: In PR context, the GitHub Action fetches policy.yaml from the
# base branch (main), not the PR branch. This prevents PRs from modifying
# the trust model (team members, gates, authorized signers) to bypass
# attestation requirements. Only the operational config (suites, commands)
# can be changed in PRs.

on:
  pull_request:
    branches: [main]

jobs:
  verify-attestations:
    name: Verify manual test attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify manual test attestations
        uses: ./packages/github-action
        with:
          policy-path: .attest-it/policy.yaml
          config-path: .attest-it/config.yaml
          fail-on-missing: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
